name: Boat Race Watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/watch.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boat-race-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Send setup test notification
        if: github.event_name == 'push'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'PY'
          import os
          import requests

          topic = os.environ["NTFY_TOPIC"]
          requests.post(
              "https://ntfy.sh",
              json={
                  "topic": topic,
                  "title": "Boat Race Watch 接続テスト",
                  "message": "GitHubからiPhoneへの通知接続に成功しました。現在は検証モードです。",
                  "priority": 4,
                  "tags": ["white_check_mark", "boat"],
              },
              timeout=20,
          ).raise_for_status()
      - name: Check upcoming races
        if: github.event_name != 'push'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SHADOW_MODE: "true"
          NOTIFY_SKIPS: "true"
          MAX_PER_RACE: "2000"
          MAX_PER_DAY: "5000"
          MIN_EXPECTED_VALUE: "1.15"
        run: python -m boat_watch.main
