name: Boat Race Watch

on:
  schedule:
    # Avoid minute 0 (GitHub's busiest time) and run every five minutes.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/watch.yml'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'

permissions:
  contents: write

concurrency:
  group: boat-race-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install '.[test]'
      - name: Run tests
        run: python -m pytest -q
      - name: Check upcoming races
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SHADOW_MODE: "true"
          NOTIFY_SKIPS: "true"
          MAX_PER_RACE: "2000"
          MAX_PER_DAY: "5000"
          MIN_EXPECTED_VALUE: "1.15"
        run: python -m boat_watch.main
      - name: Save paper-trading performance
        if: always()
        run: |
          git add data/ledger.json PERFORMANCE.md data/validation LIVE_COMPARISON.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "boat-race-watch[bot]"
          git config user.email "boat-race-watch[bot]@users.noreply.github.com"
          git commit -m "Update paper-trading performance and comparisons"
          git push
