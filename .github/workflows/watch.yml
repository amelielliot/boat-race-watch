name: Boat Race Watch

on:
  schedule:
    # Avoid minute 0 (GitHub's busiest time) and run every five minutes.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/watch.yml'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'scripts/**'

permissions:
  actions: write
  contents: write

concurrency:
  group: boat-race-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Record check start time
        run: echo "WATCH_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install '.[test]'
      - name: Run tests
        if: github.event_name == 'push'
        run: python -m pytest -q
      - name: Check upcoming races
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SHADOW_MODE: "true"
          NOTIFY_SKIPS: "true"
          MAX_PER_RACE: "2000"
          MAX_PER_DAY: "5000"
          MIN_EXPECTED_VALUE: "1.15"
        run: python -m boat_watch.main
      - name: Save paper-trading performance
        id: persist
        if: always()
        run: bash scripts/save-performance.sh
      - name: Back up records if GitHub save fails
        if: ${{ always() && steps.persist.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: performance-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/ledger.json
            PERFORMANCE.md
            data/validation/live.json
            data/validation/live-3t.json
            LIVE_COMPARISON.md
            LIVE_TRIFECTA_COMPARISON.md
          retention-days: 30
          if-no-files-found: error
      - name: Schedule the next five-minute check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Scheduled runs are not punctual enough for a deadline watcher. Keep a
          # single self-dispatched chain alive, with the cron entry as a fallback.
          if [[ "$EVENT_NAME" != "push" ]]; then
            now=$(date +%s)
            target=$((WATCH_STARTED_AT + 300))
            if (( target > now )); then
              sleep $((target - now))
            fi
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/watch.yml/dispatches" \
            --data '{"ref":"main"}'
