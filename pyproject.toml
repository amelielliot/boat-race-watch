[project]
name = "boat-race-watch"
version = "0.1.0"
description = "BOAT RACE value-watch notifications (advisory only)"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4==4.12.3",
  "requests==2.32.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
boat-watch = "boat_watch.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
